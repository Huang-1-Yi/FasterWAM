train:
  _target_: fasterwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /media/disk7t/openpi_franka/data/fold_100
  shape_meta:
    images:
      - {key: base_image, lerobot_key: base_image, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: left_wrist_image, lerobot_key: left_wrist_image, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: right_wrist_image, lerobot_key: right_wrist_image, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
    action:
      - {key: default, lerobot_key: actions, raw_shape: 14, shape: 14}
    state:
      - {key: default, lerobot_key: state, raw_shape: 14, shape: 14}
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.1
  is_training_set: true
  pretrained_norm_stats: /media/disk7t/FastWAM/data/fold100_train90_dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: robotwin
  processor:
    _target_: fasterwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    delta_action_dim_mask: null
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: fasterwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - {_target_: fasterwam.datasets.lerobot.transforms.image.ToTensor}
      - {_target_: torchvision.transforms.Resize, size: [240, 320]}
    val_transforms:
      - {_target_: fasterwam.datasets.lerobot.transforms.image.ToTensor}
      - {_target_: torchvision.transforms.Resize, size: [240, 320]}
  text_embedding_cache_dir: /media/disk7t/FastWAM/data/text_embeds_cache/fold100
  context_len: 128

