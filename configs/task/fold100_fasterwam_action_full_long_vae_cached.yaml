# @package _global_

defaults:
  - override /data: fold100_vae_cached
  - override /model: fasterwam_vae_cached
  - _self_

training_scope: action_full
init_checkpoint: /media/sata4t/hy_fasterwam_checkpoints/fasterwam_release/robotwin/step_029355.pt
action_delta_checkpoint: null
save_optimizer_state: false

batch_size: 1
num_workers: 4
lr_scheduler_type: cosine
learning_rate: 1.0e-5
num_epochs: 1
max_steps: 20000
log_every: 10
save_every: 500
eval_every: 500
eval_num_inference_steps: 4
gradient_accumulation_steps: 8
weight_decay: 1.0e-2
resume: null

model:
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null
  mot_checkpoint_mixed_attn: true
  loss:
    lambda_video: 0.0
    lambda_action: 1.0

wandb:
  enabled: false
  name: fold100_fasterwam_action_full_long_vae_cached
